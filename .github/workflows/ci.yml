name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    # macos-15 is required: Shader.compile(as:) — the only first-party check that
    # a shader's arguments match its Metal declaration — is macOS 15 / iOS 18+.
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Cache SPM
        uses: actions/cache@v5
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      # Required. SwiftPM's CLI build has no Metal rule, and default.metallib is a
      # generated artifact that is not committed. Without this step the package
      # builds green with no shader library at all — SwiftPM only *warns* about a
      # declared-but-missing resource.
      - name: Compile Metal shaders
        run: ./Scripts/build-shaders.sh

      # build-shaders.sh regenerates shader-signatures.tsv, which *is* committed —
      # it is the manifest the binding tests check every call site against. If a
      # .metal file changed without the manifest being regenerated, the two
      # disagree here rather than silently validating call sites against shaders
      # that no longer exist.
      - name: Check the shader signature manifest is current
        run: |
          git diff --exit-code -- Sources/SwiftShaders/Resources/shader-signatures.tsv \
            || { echo "::error::shader-signatures.tsv is stale. Run ./Scripts/build-shaders.sh and commit the result."; exit 1; }

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test --enable-code-coverage

      # The gallery app is a separate package that depends on this one by path —
      # the library's first external consumer. Building it here is the only check
      # that the package is usable from outside its own build graph: a product
      # that stops being vended, or a symbol that stops being public, fails here
      # and nowhere else.
      - name: Build gallery app
        run: swift build --package-path Gallery

  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: SwiftLint
        uses: norio-nomura/action-swiftlint@3.2.1
