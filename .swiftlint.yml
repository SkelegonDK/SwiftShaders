disabled_rules:
  - trailing_whitespace
  - todo

opt_in_rules:
  - empty_count
  - empty_string
  - closure_spacing
  - contains_over_filter_count
  - explicit_init
  - first_where
  - modifier_order
  - overridden_super_call
  - private_action
  - redundant_nil_coalescing

# Paths here are prefixes relative to this file, so a nested package needs its
# own entries — `.build` alone does not match `Gallery/.build`.
# Gallery/Sources is deliberately absent: the app shell is linted like the rest.
excluded:
  - .build
  - .claude
  - Package.swift
  - DerivedData
  - Gallery/.build
  - Gallery/Package.swift

line_length:
  warning: 120
  error: 200
  ignores_comments: true

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000

identifier_name:
  min_length: 2
  excluded:
    - id
    - x
    - y
    - to
